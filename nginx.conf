server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router gere la navigation cote navigateur : le serveur ne connait
    # que index.html. Sans cette ligne, recharger la page /team renverrait
    # une erreur 404, parce qu'aucun fichier "team" n'existe sur le disque.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
